<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Update Pharmacy</title><meta name="theme-color" content="#1b7a4b"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ic:#0b5d36;--cd:#fff;--ink:#15261b;--mu:#5f7266;--pr:#1b7a4b;--pl:#e3f1e8;--wn:#9a5b00;--wb:#fff1d6;--bd:#b3261e;--bb:#fde6e3;--ln:#dce5de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a14;--ic:#4cc38a;--cd:#16251c;--ink:#e6f0e9;--mu:#9bb0a2;--pr:#4cc38a;--pl:#1d3a2b;--wn:#f0b44c;--wb:#3a2e12;--bd:#ff8a80;--bb:#3b1c19;--ln:#25382d}}
:root[data-theme=dark]{--bg:#0f1a14;--ic:#4cc38a;--cd:#16251c;--ink:#e6f0e9;--mu:#9bb0a2;--pr:#4cc38a;--pl:#1d3a2b;--wn:#f0b44c;--wb:#3a2e12;--bd:#ff8a80;--bb:#3b1c19;--ln:#25382d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
aside{background:var(--bg);color:var(--ink);padding:16px 10px;border-right:1px solid var(--ln)}aside h1{font-size:18px;margin:0 8px 14px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);margin-bottom:8px;padding:10px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pl);font-weight:700}nav button svg{width:22px;height:22px;stroke:var(--ic);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-right:12px}.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.ctl button{flex:1;font-size:12px;padding:6px 4px}#login{display:none;position:fixed;inset:0;background:var(--bg);z-index:8;align-items:center;justify-content:center;padding:16px}.lo #login{display:flex}.lo .app{display:none}.rv{background:#fff;color:#000;padding:10px;border-radius:8px;font-size:13px}.rv table{min-width:0}.rv small{color:#555}.rv th{color:#555}
main{padding:16px;max-width:100%;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
.st{margin:0}.st small{display:block;color:var(--mu)}.st b{font-size:22px}.st.bad b{color:var(--bd)}.st.warn b{color:var(--wn)}
h3{margin:0 0 8px;font-size:16px}svg{width:100%;height:auto}svg text{font-size:11px;fill:var(--mu)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px;flex-wrap:wrap}
.bar input{flex:1;min-width:140px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--ink);font:inherit}
label{display:block;margin:8px 0;color:var(--mu)}
button{font:inherit;border:1px solid var(--ln);background:var(--cd);color:var(--ink);padding:7px 11px;border-radius:8px;cursor:pointer}
button.pr{background:var(--pr);border-color:var(--pr);color:#fff}button.bad{background:var(--bd);border-color:var(--bd);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.tw{overflow-x:auto;background:var(--cd);border:1px solid var(--ln);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-weight:500}
td button{margin:0 4px 4px 0}small{display:block;color:var(--mu)}
i{font-style:normal;font-size:12px;padding:1px 7px;border-radius:9px;margin-right:4px}i.bad{background:var(--bb);color:var(--bd)}i.warn{background:var(--wb);color:var(--wn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 6px;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:none}
.list{max-height:380px;overflow:auto;margin-top:8px;background:var(--cd);border:1px solid var(--ln);border-radius:10px}
.qt{white-space:nowrap}.qt button{padding:2px 9px}
.tt{display:flex;justify-content:space-between;font-size:17px;margin:4px 0}
.mut{color:var(--mu);padding:8px}
.m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:16px;z-index:9}.m.on{display:flex}
.box{background:var(--cd);border-radius:12px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
#ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}#ts.on{opacity:1}
#rc{display:none}
.lg{display:flex;align-items:center;gap:10px}.lg img{width:36px;height:36px;border-radius:8px;flex:none}#gear{margin-left:auto;padding:6px 8px}.lg #gear svg{width:22px;height:22px;fill:var(--ink);stroke:none}.lg svg{width:36px;height:36px;flex:none}
@media(max-width:899px){.app{grid-template-columns:1fr}aside{padding:12px 10px}aside h1{margin-bottom:10px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}nav button{text-align:center;padding:8px 2px;font-size:12px;margin:0;background:var(--pl)}nav button svg{display:block;margin:0 auto 3px;width:24px;height:24px}.g2{grid-template-columns:1fr}}
@media print{.app,#md,#ts,#login{display:none!important}#rc{display:block;color:#000;font-size:12px;max-width:360px}#rc table{min-width:0}}
</style></head><body class="lo">

async function doLogin(){const u=$('lu').value.trim(),p=$('lp').value,a=getA();if(!u||p.length<4)return toast('ইউজারনেম দিন ও পাসওয়ার্ড কমপক্ষে ৪ অক্ষর');if(a&&!a.h)return toast('এই অ্যাকাউন্ট Google দিয়ে লগইন করতে হবে');const h=await hs(p);if(!a)localStorage.setItem(AK,JSON.stringify({u,h}));else if(a.u!=u||a.h!=h){logH(0,'Password');return toast('ইউজারনেম বা পাসওয়ার্ড ভুল')}logH(1,'Password');sessionStorage.setItem('pin','1');boot()}
function logout(){sessionStorage.removeItem('pin');boot()}
async function gMail(){const t=await gAuth(GS0),r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw 0;const u=await r.json();if(!u.email||u.email_verified===false)throw 0;return u.email.toLowerCase()}
async function gLogin(){try{const e=await gMail(),a=getA();if(!a)localStorage.setItem(AK,JSON.stringify({u:e,h:null,g:e}));else if(!a.g){logH(0,'Google');return toast('আগে ইউজারনেম-পাসওয়ার্ডে ঢুকে মেনু থেকে Gmail যুক্ত করুন')}else if(a.g!=e){logH(0,'Google');return toast('এই Gmail এই অ্যাকাউন্টের সাথে মেলেনি')}logH(1,'Google');sessionStorage.setItem('pin','1');boot()}catch(x){gFail('Google লগইন হয়নি',x)}}
async function linkG(){try{const e=await gMail(),a=getA();if(!a)return;a.g=e;localStorage.setItem(AK,JSON.stringify(a));toast('Gmail যুক্ত হয়েছে: '+e)}catch(x){gFail('Gmail যুক্ত হয়নি',x)}}

const dev=()=>{const u=navigator.userAgent||'';return/Android/.test(u)?'Android':/iPhone|iPad/.test(u)?'iPhone':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':/Linux/.test(u)?'Linux':'—'};
function logH(ok,m){db.lh=db.lh||[];db.lh.push({t:Date.now(),ok,d:dev(),m});db.lh=db.lh.slice(-100);save()}
function supOf(o){const n=(o.ns||'').trim();if(n){let x=db.sups.find(z=>z.n.toLowerCase()==n.toLowerCase());if(!x)db.sups.push(x={id:nid(),n,ph:'',due:0});return x}return db.sups.find(x=>x.id==o.s)}
function menu(){const a=getA()||{},p=db.prof||{};setH('md',`<div class=box><h3>${esc(p.n||a.u||'')}</h3><small>${esc([p.ph,p.em,a.g].filter(Boolean).join(' · '))}</small><div class=bar style="margin-top:10px"><button onclick="closeM();profForm()">প্রোফাইল</button><button onclick="closeM();credForm()">ইউজারনেম/পাসওয়ার্ড</button>${a.g?'':'<button onclick="closeM();linkG()">Gmail যুক্ত করুন</button>'}</div><div class=bar><button onclick="closeM();setLang()">${UI.lang=='en'?'বাংলা':'English'}</button><button onclick="closeM();setTheme()">${UI.theme=='dark'?'লাইট মোড':'ডার্ক মোড'}</button></div><div class=bar><button onclick="closeM();lhist()">লগইন হিস্ট্রি</button><button onclick="closeM();go('rep')">ব্যাকআপ ও সেটিংস</button></div><div class=bar><button onclick=closeM()>বন্ধ করুন</button><button class=bad onclick="closeM();ask('লগআউট করবেন?',logout)">লগআউট</button></div></div>`);$('md').className='m on'}
function profForm(){form('প্রোফাইল',[['n','নাম'],['ph','ফোন'],['em','ইমেইল','email']],o=>{db.prof=o},db.prof||{})}
function lhist(){const l=(db.lh||[]).slice().reverse().slice(0,30);setH('md',`<div class=box><h3>এই ডিভাইসের লগইন</h3><div class=list style="max-height:50vh">${l.map(x=>`<div class=row><span>${new Date(x.t).toLocaleString(UI.lang=='en'?'en-GB':'bn-BD')}<small>${esc(x.d)}${x.m?' · '+esc(x.m):''}</small></span><i class=${x.ok?'':'bad'}>${x.ok?'সফল':'ব্যর্থ'}</i></div>`).join('')||'<p class=mut>—</p>'}</div><div class=bar style="margin-top:10px"><button onclick=closeM()>বন্ধ করুন</button></div></div>`);$('md').className='m on'}

function credForm(){form('ইউজারনেম/পাসওয়ার্ড পরিবর্তন',[['u','নতুন ইউজারনেম'],['p','নতুন পাসওয়ার্ড','password']],o=>{if(!o.u||(o.p||'').length<4)return toast('ইউজারনেম দিন ও পাসওয়ার্ড কমপক্ষে ৪ অক্ষর'),false;hs(o.p).then(h=>{localStorage.setItem(AK,JSON.stringify(Object.assign({},getA(),{u:o.u,h})));toast('পরিবর্তন হয়েছে')})},{u:(getA()||{}).u})}
loadDb().then(boot);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
