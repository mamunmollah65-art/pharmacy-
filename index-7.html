function bestMed(name){const n=nz(name);if(!n)return null;const e=RVC.get(n)||RVC.get('~'+ft(name));if(e)return e;const t=new Set(n.split(' ')),nums=[...t].filter(w=>/\d/.test(w));let best=null,bs=0;for(const m of db.meds){const mt=new Set(nz(m.n).split(' '));let i=0;t.forEach(w=>{if(mt.has(w))i++});const sc=i/(t.size+mt.size-i);if(nums.length&&!nums.every(w=>mt.has(w)))continue;if(sc>bs){bs=sc;best=m}}return bs>=.6?best:null}
